    <script>
      // Fix @vitejs/plugin-react preamble detection in custom dev server & SSR
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;

      // Suppress harmless WebSocket HMR warning in preview iframe (per AI Studio guidelines: HMR is disabled, ignore WebSocket errors)
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].includes('WebSocket connection to') || (args[0] === '[vite]' && args[1] && String(args[1]).includes('websocket')))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
